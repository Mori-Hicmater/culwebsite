{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">

    <title>{% block title %}Мой кулинарный сайт{% endblock %}</title>
</head>
<body>

    <!-- ВЕРХНИЙ БЛОК -->
    <header class="site-header py-3">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <!-- Логотип и название -->
                <a href="/" class="text-decoration-none d-flex align-items-center gap-3">
                    <img src="{% static 'main/img/logo.png' %}" alt="Логотип" style="height: 50px; width: auto;
                        border-radius: 12px; border-top-right-radius: 30px;">
                    <h1 class="header-title m-0" style="font-size: 1.8rem; color: #1f1f20; font-weight: 700;">Кулинарный компас</h1>
                </a>
                <!-- Слоган -->
                <p class="header-subtitle m-0 d-none d-md-block">Твой ориентир в мире вкуса</p>
            </div>
        </div>
    </header>

    <!-- ОСНОВНАЯ ЧАСТЬ -->
    <main class="container main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- НИЖНИЙ БЛОК -->
    <footer class="site-footer mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                    <p>Кулинарный компас</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <p>Учебный проект · Готовим с любопытством</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}
    {% endblock %}
</body>
</html>
