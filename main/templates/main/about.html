{% extends 'main/layout.html' %}

{% block title %}{{ recipe.title }}{% endblock %}

{% block content %}
<div class="mt-4">
    <a href="{% url 'home' %}" class="btn btn-outline-secondary mb-4">← Назад на главную</a>

    <div class="row">
        <div class="col-md-6 mb-4">
            <img src="{{ recipe.dishing.url }}" class="img-fluid rounded shadow" alt="{{ recipe.title }}">
        </div>

        <div class="col-md-6">
            <h1 class="display-5 fw-bold">{{ recipe.title }}</h1>
            <p class="text-muted fs-5"><strong>Тип блюда:</strong> {{ recipe.pretitele }}</p>
            <p class="text-muted fs-5"><strong>Время:</strong> {{ recipe.timecook }}</p>

            <hr>

            <h3 class="mt-4">Рецепт:</h3>
            <p class="fs-5" style="line-height: 1.8;">{{ recipe.recipe|linebreaksbr }}</p>
        </div>
    </div>
</div>
{% endblock %}
